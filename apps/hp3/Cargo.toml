[package]
name = "hp3"
description = "Desktop runner: opens a window and plays a level."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "hp3app"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "hp3"
path = "src/main.rs"

[dependencies]
hp3-core.workspace = true
hp3-package.workspace = true
hp3-assets.workspace = true
hp3-script.workspace = true
hp3-world = { path = "../../crates/hp3-world" }
hp3-render = { path = "../../crates/hp3-render" }
hp3-engine = { path = "../../crates/hp3-engine" }
wgpu = "26"
glam = "0.30"
pollster = "0.4"
hp3-audio = { path = "../../crates/hp3-audio" }

# Desktop: SDL3 built from its source and linked in. Android: the SDL3 library of the APK, linked dynamically.
[target.'cfg(not(target_os = "android"))'.dependencies]
png = "0.17"
sdl3 = { version = "0.20", features = ["build-from-source-static", "raw-window-handle"] }
# The allocator is mimalloc; on Android the library is dlopen'ed, which cannot use initial-exec thread-locals (the load failed with
# `TLS symbol "(null)" ... using IE access model`), so it takes the local-dynamic model there.
mimalloc = { version = "0.1", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
sdl3 = { version = "0.20", features = ["raw-window-handle"] }
libc = "0.2"
mimalloc = { version = "0.1", default-features = false, features = ["local_dynamic_tls"] }
