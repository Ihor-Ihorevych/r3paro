# Builds R3paro on GitHub's runners: the Windows game and tools, and a check of the Android library.
# The game's data is never in CI, so nothing here runs a level. A pushed tag v<major>.<minor>.<patch> (it must match the
# version in Cargo.toml) also publishes the Windows zip as a pre-release; a manual run keeps it as an artifact.
# The APK is built by Flipendo Droid's workflow (it needs Flipendo's SDL3 and Java side).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml names the stable toolchain and the Android target; rustup installs them on first use
      - name: Toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # SDL3 is built from source (the sdl3 crate's build-from-source-static): CMake is on the runner
      - name: Build
        run: cargo build --release -p hp3 -p hp3-run -p hp3-view -p hp3-pkg

      - name: Tests
        run: cargo test --release --workspace --exclude hp3

      # not a gate yet: the code has warnings to clean up first
      - name: Clippy
        continue-on-error: true
        run: cargo clippy --release --workspace --exclude hp3 -- -D clippy::correctness

      - name: Version
        id: version
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($VERSION): tag v$VERSION"
            exit 1
          fi

      - name: Package
        run: |
          DIR="r3paro-${{ steps.version.outputs.version }}-windows"
          mkdir "$DIR"
          cp target/release/hp3.exe target/release/hp3-run.exe target/release/hp3-view.exe target/release/hp3-pkg.exe "$DIR/"
          cp README.md LICENSE CLEANROOM.md "$DIR/"
          7z a -tzip "$DIR.zip" "$DIR" > /dev/null
          echo "ZIP=$DIR.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: r3paro-windows
          path: ${{ env.ZIP }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: R3paro ${{ steps.version.outputs.version }}
          files: ${{ env.ZIP }}
          prerelease: true
          generate_release_notes: true
          body: |
            The engine for Harry Potter and the Prisoner of Azkaban, for Windows: `hp3.exe <your HP3 folder> [map]`.
            **No game data inside**: you need your own copy of the PC game. Controls, options and tools: README.
            On Android the engine is part of Flipendo Droid.

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # the shared library (linking against Flipendo's libSDL3.so happens in Flipendo's build): the code must type-check
      # for the phone
      - name: Check the Android library
        run: cargo check --target aarch64-linux-android -p hp3 --lib
